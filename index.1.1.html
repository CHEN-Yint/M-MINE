<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>M·MINE</title>
<style>
/* ============================================================
   M·MINE - 移动端单页应用
   设计规范：极简黑白灰，留白克制，类 Instagram 信息架构
   ============================================================ */

:root {
  --bg-main: #FFFFFF;
  --text-primary: #000000;
  --text-secondary: #8E8E93;
  --text-tertiary: #AEAEB2;
  --divider: #E5E5EA;
  --border: #D1D1D6;
  --top-atmosphere: #F2F2F7;
  --danger: #FF3B30;

  --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));

  --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.12);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  touch-action: manipulation;
}
html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-main);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
               Helvetica, "Segoe UI", Roboto, "Hiragino Sans GB", "Microsoft YaHei",
               sans-serif;
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body.no-scroll { overflow: hidden; }

.app {
  width: 100%;
  max-width: 428px;
  min-height: 100vh;
  margin: 0 auto;
  position: relative;
  background: var(--bg-main);
  padding-bottom: calc(90px + var(--safe-bottom));
}

/* ============================================================
   1. 顶部氛围区（默认纯色，可被背景图覆盖）
   ============================================================ */
.atmosphere {
  width: 100%;
  height: 22vh;
  min-height: 140px;
  background: var(--top-atmosphere);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
  transition: background-image 0.3s ease;
}

/* ============================================================
   2. 个人信息区
   ============================================================ */
.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 20px 16px;
  background: var(--bg-main);
  position: relative;
}

/* 头像：上移一点与氛围区形成层次 */
.avatar-wrap {
  margin-top: -42px;
  position: relative;
}

.avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 3px solid #FFFFFF;
  background: var(--top-atmosphere);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-edit-hint {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 22px;
  height: 22px;
  background: var(--text-primary);
  color: var(--bg-main);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  border: 2px solid #FFFFFF;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.avatar:active .avatar-edit-hint { opacity: 1; }

.avatar input[type="file"] { display: none; }

.username {
  margin-top: 12px;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.2px;
}

.bio {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 300;
  color: var(--text-secondary);
  text-align: center;
  min-height: 16px;
}

.stats {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 0;
  gap: 0;
  justify-content: center;
  width: 100%;
  max-width: 320px;
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  background: transparent;
  border: none;
  padding: 4px 0;
  font-family: inherit;
  color: inherit;
}

.stat-item:active { opacity: 0.6; }

/* 朋友统计的"可点击"暗示：悬停时数字带轻微下划线 */
#stat-friends-btn:hover .stat-number {
  text-decoration: underline;
  text-decoration-color: var(--text-tertiary, #AEAEB2);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

#stat-friends-btn:hover .stat-label {
  color: var(--text-primary);
}

.stat-item.active {
  color: var(--text-primary);
}

.stat-item.active .stat-label {
  color: var(--text-primary);
  font-weight: 500;
}

.stat-number {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.1;
}

.stat-label {
  font-size: 12px;
  font-weight: 300;
  color: var(--text-secondary);
}

/* ============================================================
   3. 操作按钮
   ============================================================ */
.actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 8px 20px 20px;
  background: var(--bg-main);
}

.btn {
  width: 40%;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s ease, opacity 0.15s ease;
  font-family: inherit;
}

.btn:active {
  background: var(--top-atmosphere);
  opacity: 0.7;
}

.btn-full { width: 100%; }

/* ============================================================
   4. 画廊网格（3 列等宽正方形）+ 时间标签悬浮
   ============================================================ */
.divider {
  height: 1px;
  background: var(--divider);
  margin: 0;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 4px;
  gap: 4px;
  padding: 4px;
  min-height: 30vh;
}

.gallery.empty {
  grid-template-columns: 1fr;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px 60px;
}

.gallery-empty {
  text-align: center;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.gallery-empty-icon {
  font-size: 40px;
  font-weight: 200;
  color: var(--text-tertiary);
  line-height: 1;
  margin-bottom: 4px;
}

.gallery-empty-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}

.gallery-empty-hint {
  font-size: 12px;
  color: var(--text-secondary);
}

.gallery-item {
  position: relative;
  height: 0;
  padding-top: 100%;
  overflow: hidden;
  background: var(--top-atmosphere);
  cursor: pointer;
}
@supports (aspect-ratio: 1 / 1) {
  .gallery-item {
    height: auto;
    padding-top: 0;
    aspect-ratio: 1 / 1;
  }
}

.gallery-item img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease, opacity 0.15s ease;
}

.gallery-item:active img {
  transform: scale(0.97);
  opacity: 0.85;
}

/* 多图标识 */
.gallery-item .badge-multi {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 2px;
}
@supports ((-webkit-backdrop-filter: blur(4px)) or (backdrop-filter: blur(4px))) {
  .gallery-item .badge-multi {
    background: rgba(0, 0, 0, 0.55);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
}

/* 时间标签：右下角悬浮 */
.gallery-item .badge-time {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 8px;
}
@supports ((-webkit-backdrop-filter: blur(4px)) or (backdrop-filter: blur(4px))) {
  .gallery-item .badge-time {
    background: rgba(0, 0, 0, 0.55);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
}

/* ============================================================
   5. 底部"+"悬浮按钮
   ============================================================ */
.fab {
  position: fixed;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--text-primary);
  color: var(--bg-main);
  border: none;
  font-size: 28px;
  font-weight: 300;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 50;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.fab:active {
  transform: translateX(-50%) scale(0.92);
  opacity: 0.85;
}

.fab-label {
  position: fixed;
  bottom: calc(8px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--text-secondary);
  z-index: 50;
  pointer-events: none;
}

/* ============================================================
   弹窗 / Modal 通用样式
   ============================================================ */
.modal-mask {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.modal-mask.show {
  display: flex;
  opacity: 1;
}

/* ★ 详情页：不透明纯白背景，杜绝 atmosphere/banner 颜色透过 */
.modal-mask.detail {
  background: #FFFFFF;
  align-items: stretch;
}

.modal-mask.detail .modal {
  max-width: 428px;
  margin: 0 auto;
  width: 100%;
  /* ★ 三重保险：modal 本体也强制不透明纯白 + 强制默认主题色，绝不透传任何子元素颜色 */
  background: #FFFFFF !important;
  background-image: none !important;
  color: var(--text-primary);
}

.modal-mask.detail .detail-carousel,
.modal-mask.detail .detail-carousel-track,
.modal-mask.detail .detail-caption,
.modal-mask.detail .detail-time,
.modal-mask.detail .comment-list,
.modal-mask.detail .detail-actions,
.modal-mask.detail .detail-delete-bar {
  background-image: none !important;
  background: transparent;
  background-color: transparent;
}

.modal-mask.detail .detail-carousel {
  background-color: #F2F2F7; /* 轮播占位灰，万一图片加载失败 */
}

/* 居中弹窗（用于等待层） */
.modal-mask.center {
  align-items: center;
}

.modal {
  width: 100%;
  max-width: 428px;
  background: var(--bg-main);
  border-radius: 16px 16px 0 0;
  padding: 16px 20px calc(20px + var(--safe-bottom));
  max-height: 90vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
}

.modal-mask.show .modal {
  transform: translateY(0);
}

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 16px;
  color: var(--text-primary);
}

/* ---- 详情页 ---- */
.detail-close {
  position: absolute;
  top: 12px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  border: none;
  font-size: 18px;
  color: var(--text-primary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
@supports ((-webkit-backdrop-filter: blur(6px)) or (backdrop-filter: blur(6px))) {
  .detail-close {
    background: rgba(255,255,255,0.72);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
}

.detail-carousel {
  width: 100%;
  height: 0;
  padding-top: 100%;
  background: var(--top-atmosphere);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  margin-bottom: 14px;
}
@supports (aspect-ratio: 1 / 1) {
  .detail-carousel {
    height: auto;
    padding-top: 0;
    aspect-ratio: 1 / 1;
  }
}

.detail-carousel-track {
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transition: transform 0.3s ease;
  will-change: transform;
}

.detail-carousel-track img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  flex-shrink: 0;
}

.detail-carousel-dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  z-index: 2;
}

.detail-carousel-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  transition: background 0.2s ease;
}

.detail-carousel-dots span.active {
  background: #fff;
}

.detail-caption {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-primary);
  margin-bottom: 8px;
  line-height: 1.5;
  word-wrap: break-word;
}

.detail-time {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}

.comments-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.comments-title::before {
  content: "";
  width: 3px;
  height: 12px;
  background: var(--text-primary);
  border-radius: 2px;
}

.comment-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 20px;
}

.comment {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.comment-avatar {
  width: 32px;
  height: 32px;
  min-width: 32px;          /* 防止 flex 把它压扁 */
  border-radius: 50%;
  background: var(--top-atmosphere);
  border: 1px solid var(--divider);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  overflow: hidden;          /* ★ 防止 <img> 自然尺寸溢出 */
  position: relative;
}

.comment-avatar img {
  width: 100%;               /* ★ 关键：图片作为头像时强制填满 32x32 */
  height: 100%;
  object-fit: cover;
  display: block;
}

.comment-body {
  flex: 1;
  min-width: 0;
}

.comment-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 4px;
}

.comment-text {
  font-size: 13px;
  font-weight: 300;
  color: var(--text-primary);
  margin-top: 2px;
  line-height: 1.5;
  word-wrap: break-word;
}

.comment-time {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* 评论下的"回复"按钮 */
.comment-reply-btn {
  margin-top: 4px;
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  font-size: 12px;
  font-family: inherit;
  padding: 0;
  cursor: pointer;
}
.comment-reply-btn:active { color: var(--text-secondary); }

/* 回复输入行 */
.reply-form {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  align-items: center;
}
.reply-input {
  flex: 1;
  height: 28px;
  border: 1px solid var(--divider);
  border-radius: 6px;
  padding: 0 10px;
  font-size: 12px;
  font-family: inherit;
  background: var(--top-atmosphere);
  color: var(--text-primary);
  outline: none;
}
.reply-input:focus { border-color: var(--text-primary); }
.reply-send {
  height: 24px;
  padding: 0 12px;
  border: none;
  border-radius: 6px;
  background: var(--text-primary);
  color: var(--bg-main);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.reply-send:active { opacity: 0.8; }

/* 已发送的回复列表 */
.reply-list {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.reply {
  display: flex;
  gap: 8px;
  padding-left: 32px;
  border-top: 1px solid var(--divider);
  padding-top: 8px;
}
.reply-avatar {
  width: 24px;
  height: 24px;
  min-width: 24px;
  border-radius: 50%;
  background: var(--top-atmosphere);
  border: 1px solid var(--divider);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  overflow: hidden;
  flex-shrink: 0;
}
.reply-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.reply-body { flex: 1; min-width: 0; }
.reply-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.reply-text { font-size: 12px; color: var(--text-primary); margin-top: 2px; line-height: 1.5; }
.reply-time { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }

/* 性格特征 / 身份背景 pills */
.trait-pairs {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.trait-pair-row {
  display: flex;
  gap: 8px;
}
.trait-pill {
  flex: 1;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}
.trait-pill:active { opacity: 0.7; }
.trait-pill.active {
  background: var(--text-primary);
  color: var(--bg-main);
  border-color: var(--text-primary);
}
.identity-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.identity-pill {
  height: 28px;
  padding: 0 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}
.identity-pill:active { opacity: 0.7; }
.identity-pill.active {
  background: var(--text-primary);
  color: var(--bg-main);
  border-color: var(--text-primary);
}
.identity-custom-input {
  display: none;
}

/* 草稿按钮（首页 FAB 旁） */
.fab-drafts {
  position: fixed;
  bottom: calc(86px + var(--safe-bottom));
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--top-atmosphere);
  color: var(--text-primary);
  border: 1px solid var(--border);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
.fab-drafts:active { opacity: 0.7; }
.fab-drafts-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 9px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}

/* 草稿列表项 */
.drafts-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 60vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 12px;
}
.draft-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--top-atmosphere);
  border-radius: 10px;
  cursor: pointer;
}
.draft-row:active { opacity: 0.7; }
.draft-thumb {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  background: var(--bg-main);
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
  border: 1px solid var(--divider);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--text-tertiary);
}
.draft-info { flex: 1; min-width: 0; }
.draft-caption {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.draft-time {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
}
.draft-delete {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--danger);
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.draft-delete:active { background: rgba(255, 59, 48, 0.08); }
.drafts-empty {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-tertiary);
  font-size: 13px;
}

/* 上传弹窗 footer 三按钮 */
.upload-footer-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.upload-footer-actions .btn {
  flex: 1;
  height: 40px;
}
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-primary);
}
.btn-outline:active { background: var(--top-atmosphere); }

/* 详情页底部交互栏 */
.detail-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--divider);
  padding-top: 12px;
  margin-top: 4px;
}

.detail-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 6px 0;
  font-family: inherit;
  color: var(--text-secondary);
}

.detail-action .ic {
  font-size: 20px;
  line-height: 1;
  transition: transform 0.15s ease;
}

.detail-action:active .ic { transform: scale(0.9); }

.detail-action .lbl {
  font-size: 11px;
}

.detail-action.liked { color: #FF3B30; }
.detail-action.collected { color: #FFCC00; }

.detail-delete-bar {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--divider);
}

.btn-danger {
  color: var(--danger);
  border-color: var(--danger);
  width: 100%;
  height: 38px;
}

.btn-danger:active {
  background: rgba(255, 59, 48, 0.08);
}

/* ---- 编辑主页表单 ---- */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 400;
}

.form-input,
.form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-main);
  font-size: 14px;
  color: var(--text-primary);
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease;
}

.form-input:focus,
.form-textarea:focus {
  border-color: var(--text-primary);
}

.form-textarea {
  resize: none;
  min-height: 70px;
}

.form-hint {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 4px;
  text-align: right;
}

.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

.modal-actions .btn {
  width: 50%;
  height: 40px;
}

.btn-primary {
  background: var(--text-primary);
  color: var(--bg-main);
  border-color: var(--text-primary);
}

.btn-primary:disabled {
  background: var(--text-tertiary);
  border-color: var(--text-tertiary);
  opacity: 0.5;
  cursor: not-allowed;
}

/* 更换背景按钮（编辑主页内） */
.banner-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0 4px;
}

.banner-thumb {
  width: 56px;
  height: 56px;
  border-radius: 8px;
  background: var(--top-atmosphere);
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
  border: 1px solid var(--divider);
}

.banner-pick {
  flex: 1;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}

.banner-pick:active { background: var(--top-atmosphere); }

/* ---- 上传面板 ---- */
.upload-zone {
  width: 100%;
  min-height: 180px;
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  background: var(--top-atmosphere);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--text-secondary);
  cursor: pointer;
  margin-bottom: 12px;
  transition: background 0.15s ease;
}

.upload-zone:active { background: var(--divider); }

.upload-icon {
  font-size: 30px;
  font-weight: 200;
  color: var(--text-tertiary);
}

.upload-text { font-size: 13px; }
.upload-hint { font-size: 11px; color: var(--text-tertiary); }

.upload-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 4px;
  gap: 4px;
  margin-bottom: 12px;
}

.upload-preview .slot {
  position: relative;
  height: 0;
  padding-top: 100%;
  border-radius: 6px;
  overflow: hidden;
  background: var(--top-atmosphere);
}
@supports (aspect-ratio: 1 / 1) {
  .upload-preview .slot {
    height: auto;
    padding-top: 0;
    aspect-ratio: 1 / 1;
  }
}

.upload-preview .slot img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.upload-preview .slot-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: #fff;
  border: none;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
}

.upload-preview .slot-add {
  border: 1.5px dashed var(--border);
  background: var(--bg-main);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-tertiary);
  font-size: 24px;
  font-weight: 200;
  cursor: pointer;
}

/* ---- 等待覆盖层 ---- */
.waiting {
  width: calc(100% - 48px);
  max-width: 380px;
  background: var(--bg-main);
  border-radius: 16px;
  padding: 28px 24px 24px;
  text-align: center;
  transform: scale(0.92);
  opacity: 0;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.modal-mask.show .waiting {
  transform: scale(1);
  opacity: 1;
}

.waiting-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.waiting-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 20px;
  line-height: 1.6;
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--divider);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--text-primary);
  border-radius: 2px;
  transition: width 0.3s linear;
}

.progress-label {
  font-size: 11px;
  color: var(--text-tertiary);
}

/* ---- Toast ---- */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.toast.show { opacity: 1; }

/* ---- 确认弹窗 ---- */
.confirm-modal {
  width: calc(100% - 60px);
  max-width: 320px;
  background: var(--bg-main);
  border-radius: 14px;
  padding: 24px 20px 16px;
  text-align: center;
  transform: scale(0.92);
  opacity: 0;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.modal-mask.show .confirm-modal {
  transform: scale(1);
  opacity: 1;
}

.confirm-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.confirm-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 20px;
}

.confirm-actions {
  display: flex;
  gap: 8px;
}

.confirm-actions .btn {
  flex: 1;
  height: 38px;
  font-size: 14px;
}

@media (max-width: 374px) {
  .username { font-size: 16px; }
  .stat-number { font-size: 17px; }
  .bio { font-size: 11px; }
  .detail-actions { grid-template-columns: repeat(3, 1fr); }
  .detail-action .lbl { font-size: 10px; }
}

/* ============================================================
   分类标签（人物/风景/美食/游戏/日常/其他）
   ============================================================ */
.category-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.cat-chip {
  height: 28px;
  padding: 0 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}

.cat-chip:active { opacity: 0.7; }

.cat-chip.active {
  background: var(--text-primary);
  color: var(--bg-main);
  border-color: var(--text-primary);
}

/* ============================================================
   AI 朋友管理
   ============================================================ */
.ai-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}

.ai-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--top-atmosphere);
  border-radius: 10px;
}

.ai-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--divider);
}

.ai-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ai-name {

}

.ai-edit-btn {

  cursor: pointer;
  display: flex;

.ai-edit-btn:active { background: var(--divider); }

.ai-edit-panel {

  padding: 14px;

}

.ai-edit-panel.show { display: block; }

.ai-edit-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text-primary);
}

.ai-avatar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.ai-avatar-preview {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--top-atmosphere);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  border: 1px solid var(--divider);
  overflow: hidden;
  flex-shrink: 0;
}

.ai-avatar-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ai-emoji-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-gap: 6px;
  gap: 6px;
  margin-bottom: 12px;
}

.ai-emoji-btn {
  height: 44px;
  border: 1px solid var(--divider);
  background: var(--bg-main);
  border-radius: 8px;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  padding: 0;
}

.ai-emoji-btn:active { background: var(--top-atmosphere); }
.ai-emoji-btn.active {
  border-color: var(--text-primary);
  background: var(--top-atmosphere);
}

.ai-upload-btn {
  width: 100%;
  height: 32px;
  border: 1px solid var(--border);

  color: var(--text-primary);

  cursor: pointer;
  font-family: inherit;
  margin-bottom: 12px;
}

.ai-upload-btn:active { background: var(--top-atmosphere); }

.ai-edit-actions {
  display: flex;
  gap: 8px;
}

.ai-edit-actions .btn {
  flex: 1;
  height: 36px;
  font-size: 13px;
}

/* ============================================================
   主题颜色（编辑主页）
   ============================================================ */
.theme-swatches {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-gap: 10px;
  gap: 10px;
  margin-top: 4px;
}

.theme-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  padding: 4px;
  cursor: pointer;
  font-family: inherit;
}

.theme-swatch-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-swatch-circle::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: var(--swatch-bg);
}

.theme-swatch-circle::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 14px;
  background: var(--swatch-text);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 3px var(--swatch-bg);
}

.theme-swatch-label {
  font-size: 11px;
  color: var(--text-secondary);
}

.theme-swatch.active .theme-swatch-circle {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px var(--bg-main), 0 0 0 4px var(--text-primary);
}

.theme-swatch.active .theme-swatch-label {
  color: var(--text-primary);
  font-weight: 500;
}

/* ============================================================
   数据管理（导出/导入）
   ============================================================ */
.data-row {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--divider);
}

.data-btn {
  flex: 1;
  height: 24px;
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  font-size: 10px;
  font-family: inherit;
  cursor: pointer;
  padding: 0;
}

.data-btn:active { opacity: 0.5; }

@supports (aspect-ratio: 4 / 3) {
  .upload-zone {
    min-height: 0;
    aspect-ratio: 4 / 3;
  }
}
@supports (aspect-ratio: 1 / 1) {
  .ai-emoji-btn {
    height: auto;
    aspect-ratio: 1 / 1;
  }
}

.selectable-text {
  -webkit-user-select: text;
  user-select: text;
  word-break: break-all;
  white-space: pre-wrap;
}

.comments-title::before { margin-right: 6px; }

.stat-item > * + * { margin-top: 2px; }
.actions > * + * { margin-left: 12px; }
.gallery-empty > * + * { margin-top: 8px; }
.gallery-item .badge-multi > * + * { margin-left: 2px; }
.detail-carousel-dots > * + * { margin-left: 4px; }
.comment-list > * + * { margin-top: 14px; }
.comment > * + * { margin-left: 10px; }
.comment-name > * + * { margin-left: 4px; }
.reply-form > * + * { margin-left: 6px; }
.reply-list > * + * { margin-top: 8px; }
.reply > * + * { margin-left: 8px; }
.trait-pairs > * + * { margin-top: 8px; }
.trait-pair-row > * + * { margin-left: 8px; }
.identity-pill { margin-right: 8px; margin-bottom: 8px; }
.drafts-list > * + * { margin-top: 10px; }
.draft-row > * + * { margin-left: 12px; }
.upload-footer-actions > * + * { margin-left: 8px; }
.detail-action > * + * { margin-top: 4px; }
.modal-actions > * + * { margin-left: 12px; }
.banner-row > * + * { margin-left: 12px; }
.upload-zone > * + * { margin-top: 6px; }
.confirm-actions > * + * { margin-left: 8px; }
.cat-chip { margin-right: 8px; margin-bottom: 8px; }
.ai-list > * + * { margin-top: 10px; }
.ai-row > * + * { margin-left: 12px; }
.ai-avatar-row > * + * { margin-left: 12px; }
.ai-edit-actions > * + * { margin-left: 8px; }
.theme-swatch > * + * { margin-top: 6px; }
.data-row > * + * { margin-left: 8px; }

.supports-flex-gap .stat-item > * + *,
.supports-flex-gap .actions > * + *,
.supports-flex-gap .gallery-empty > * + *,
.supports-flex-gap .gallery-item .badge-multi > * + *,
.supports-flex-gap .detail-carousel-dots > * + *,
.supports-flex-gap .comment-list > * + *,
.supports-flex-gap .comment > * + *,
.supports-flex-gap .comment-name > * + *,
.supports-flex-gap .reply-form > * + *,
.supports-flex-gap .reply-list > * + *,
.supports-flex-gap .reply > * + *,
.supports-flex-gap .trait-pairs > * + *,
.supports-flex-gap .trait-pair-row > * + *,
.supports-flex-gap .drafts-list > * + *,
.supports-flex-gap .draft-row > * + *,
.supports-flex-gap .upload-footer-actions > * + *,
.supports-flex-gap .detail-action > * + *,
.supports-flex-gap .modal-actions > * + *,
.supports-flex-gap .banner-row > * + *,
.supports-flex-gap .upload-zone > * + *,
.supports-flex-gap .confirm-actions > * + *,
.supports-flex-gap .ai-list > * + *,
.supports-flex-gap .ai-row > * + *,
.supports-flex-gap .ai-avatar-row > * + *,
.supports-flex-gap .ai-edit-actions > * + *,
.supports-flex-gap .theme-swatch > * + *,
.supports-flex-gap .data-row > * + * {
  margin-top: 0;
  margin-left: 0;
}
.supports-flex-gap .identity-pill,
.supports-flex-gap .cat-chip {
  margin-right: 0;
  margin-bottom: 0;
}
.supports-flex-gap .comments-title::before { margin-right: 0; }

/* ============================================================
   图片比例选择
   ============================================================ */
.ratio-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.ratio-chip {
  flex: 1;
  height: 32px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
}
.ratio-chip.active {
  background: var(--text-primary);
  color: var(--bg-main);
  border-color: var(--text-primary);
}

/* 详情页 3:4 竖向比例 */
.detail-carousel.ratio-3-4 {
  aspect-ratio: 3 / 4;
  height: auto;
  padding-top: 0;
}
@supports not (aspect-ratio: 3 / 4) {
  .detail-carousel.ratio-3-4 {
    height: 0;
    padding-top: 133.33%;
  }
}
</style>

<body>
<div class="app" id="app">

  <!-- 1. 顶部氛围区 -->
  <div class="atmosphere" id="atmosphere"></div>

  <!-- 2. 个人信息区 -->
  <section class="profile">
    <div class="avatar-wrap">
      <label class="avatar" id="avatar">
        <!-- 默认头像由 JS 渲染（占位 SVG 或用户图） -->
        <input type="file" id="avatar-input" accept="image/*" />
        <div class="avatar-edit-hint">✎</div>
      </label>
    </div>
    <div class="username" id="username">M-MINE</div>
    <div class="bio" id="bio">今天开始记录生活</div>
    <div class="stats">
      <div class="stat-item" data-stat="works">
        <span class="stat-number" id="stat-works">0</span>
        <span class="stat-label">作品</span>
      </div>
      <div class="stat-item" data-stat="friends" id="stat-friends-btn">
        <span class="stat-number" id="stat-friends">0</span>
        <span class="stat-label">朋友</span>
      </div>
      <div class="stat-item" data-stat="collected" id="stat-collected-btn">
        <span class="stat-number" id="stat-collected">0</span>
        <span class="stat-label">收藏</span>
      </div>
    </div>
  </section>

  <!-- 3. 操作按钮 -->
  <div class="actions">
    <button class="btn" id="btn-edit">编辑主页</button>
    <button class="btn" id="btn-share">分享主页</button>
  </div>

  <div class="divider"></div>

  <!-- 4. 画廊网格 -->
  <div id="collected-indicator" style="display:none;padding:10px 20px 6px;background:var(--bg-main);font-size:12px;color:var(--text-secondary);align-items:center;justify-content:space-between;">
    <span>只显示已收藏作品</span>
    <button id="collected-indicator-close" style="background:transparent;border:none;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:inherit;padding:0;">×</button>
  </div>
  <section class="gallery empty" id="gallery">
    <div class="gallery-empty">
      <div class="gallery-empty-icon">⌖</div>
      <div class="gallery-empty-title">还没有作品</div>
      <div class="gallery-empty-hint">点击下方 · 添加第一张</div>
    </div>
  </section>

  <!-- 5. 底部 + 按钮 -->
  <button class="fab" id="fab-add" aria-label="添加">+</button>
  <div class="fab-label">添加</div>
  <button class="fab-drafts" id="fab-drafts" aria-label="草稿箱">📝</button>

</div>

<!-- ============ 弹窗：作品详情 ============ -->
<div class="modal-mask detail" id="modal-detail">
  <div class="modal" data-stop style="position:relative;">
    <button class="detail-close" id="detail-close" aria-label="关闭">×</button>
    <div class="modal-handle"></div>
    <div class="detail-carousel" id="detail-carousel">
      <div class="detail-carousel-track" id="detail-track"></div>
      <div class="detail-carousel-dots" id="detail-dots"></div>
    </div>
    <div class="detail-caption" id="detail-caption" style="display:none;"></div>
    <div class="detail-time" id="detail-time"></div>

    <div class="comments-title">评论</div>
    <div class="comment-list" id="comment-list"></div>

    <!-- 底部交互栏 -->
    <div class="detail-actions">
      <button class="detail-action" id="act-like">
        <span class="ic">♡</span>
        <span class="lbl" id="act-like-label">点赞</span>
      </button>
      <button class="detail-action" id="act-comment">
        <span class="ic">💬</span>
        <span class="lbl" id="act-comment-label">评论</span>
      </button>
      <button class="detail-action" id="act-collect">
        <span class="ic">☆</span>
        <span class="lbl" id="act-collect-label">收藏</span>
      </button>
    </div>

    <div class="detail-delete-bar">
      <button class="btn btn-danger" id="act-delete">删除作品</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：编辑主页 ============ -->
<div class="modal-mask" id="modal-edit">
  <div class="modal" data-stop>
    <div class="modal-handle"></div>
    <div class="modal-title">编辑主页</div>

    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" class="form-input" id="edit-username" maxlength="20" />
    </div>

    <div class="form-group">
      <label class="form-label">Bio 简介</label>
      <textarea class="form-textarea" id="edit-bio" maxlength="60"></textarea>
      <div class="form-hint" id="bio-counter">0 / 60</div>
    </div>

    <div class="form-group">
      <label class="form-label">顶部背景</label>
      <div class="banner-row">
        <div class="banner-thumb" id="banner-thumb"></div>
        <button class="banner-pick" id="btn-pick-banner">更换背景</button>
      </div>
      <input type="file" id="banner-input" accept="image/*" style="display:none" />
    </div>

    <div class="modal-actions">
      <button class="btn" id="edit-cancel">取消</button>
      <button class="btn btn-primary" id="edit-save">保存</button>
    </div>

    <div class="form-group" style="margin-top: 20px; margin-bottom: 0;">
      <label class="form-label">主题颜色</label>
      <div class="theme-swatches" id="theme-swatches">
        <button class="theme-swatch active" data-theme="default" type="button">
          <span class="theme-swatch-circle" style="--swatch-bg:#FFFFFF;--swatch-text:#000000;"></span>
          <span class="theme-swatch-label">黑白</span>
        </button>
        <button class="theme-swatch" data-theme="barbie" type="button">
          <span class="theme-swatch-circle" style="--swatch-bg:#FFF0F5;--swatch-text:#8B2E52;"></span>
          <span class="theme-swatch-label">芭比粉</span>
        </button>
        <button class="theme-swatch" data-theme="baby" type="button">
          <span class="theme-swatch-circle" style="--swatch-bg:#F0F7FF;--swatch-text:#1E4A6E;"></span>
          <span class="theme-swatch-label">Baby蓝</span>
        </button>
        <button class="theme-swatch" data-theme="grass" type="button">
          <span class="theme-swatch-circle" style="--swatch-bg:#F2FAF0;--swatch-text:#2D4A2A;"></span>
          <span class="theme-swatch-label">青草绿</span>
        </button>
        <button class="theme-swatch" data-theme="lemon" type="button">
          <span class="theme-swatch-circle" style="--swatch-bg:#FFFDF0;--swatch-text:#6B5A1E;"></span>
          <span class="theme-swatch-label">柠檬黄</span>
        </button>
      </div>
    </div>

    <div class="data-row">
      <button class="data-btn" id="btn-export-data" type="button">导出数据</button>
      <button class="data-btn" id="btn-import-data" type="button">导入数据</button>
      
    </div>

    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--divider);text-align:center;">
      <button id="btn-reset-data" style="background:transparent;border:none;color:var(--text-tertiary);font-size:11px;font-family:inherit;cursor:pointer;padding:6px 12px;">清除本地数据并重置</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：上传作品 ============ -->
<div class="modal-mask" id="modal-upload">
  <div class="modal" data-stop>
    <div class="modal-handle"></div>
    <div class="modal-title">发布新作品</div>

    <!-- 图片选择区（动态切换：初始 / 预览网格） -->
    <div class="upload-zone" id="upload-zone">
      <div class="upload-icon">+</div>
      <div class="upload-text">点击选择图片</div>
      <div class="upload-hint">最多 9 张，可单选或多选</div>
      <input type="file" id="upload-input" accept="image/*" multiple style="display:none" />
    </div>
    <div class="upload-preview" id="upload-preview" style="display:none;"></div>

    <div class="form-group">
      <textarea class="form-textarea" id="upload-caption" maxlength="200"
                placeholder="此刻的心情...（选填）"></textarea>
      <div class="form-hint" id="caption-counter">0 / 200</div>
    </div>

    <div class="form-group">
      <label class="form-label">分类（可多选，选填）</label>
      <div class="category-row" id="category-row">
        <button type="button" class="cat-chip" data-cat="人物">人物</button>
        <button type="button" class="cat-chip" data-cat="风景">风景</button>
        <button type="button" class="cat-chip" data-cat="美食">美食</button>
        <button type="button" class="cat-chip" data-cat="游戏">游戏</button>
        <button type="button" class="cat-chip" data-cat="日常">日常</button>
        <button type="button" class="cat-chip" data-cat="其他">其他</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">图片比例</label>
      <div class="ratio-row" id="ratio-row">
        <button type="button" class="ratio-chip active" data-ratio="1:1">1:1 方形</button>
        <button type="button" class="ratio-chip" data-ratio="3:4">3:4 竖向</button>
      </div>
    </div>

    <div class="modal-actions upload-footer-actions">
      <button class="btn" id="upload-cancel">取消</button>
      <button class="btn btn-outline" id="upload-save-draft">保存草稿</button>
      <button class="btn btn-primary" id="upload-confirm">发布</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：等待 AI 揣摩 ============ -->
<div class="modal-mask center" id="modal-waiting">
  <div class="waiting" data-stop>
    <div class="waiting-title">上传中....</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label" id="progress-label">0%</div>
  </div>
</div>

<!-- ============ 弹窗：AI 朋友管理 ============ -->
<div class="modal-mask" id="modal-ai">
  <div class="modal" data-stop>
    <div class="modal-handle"></div>
    <div class="modal-title">我的AI朋友</div>
    <div class="ai-list" id="ai-list"></div>
    <div class="form-group" style="margin-top: 8px; margin-bottom: 0;">
      <button class="btn btn-full" id="btn-ai-add">+ 添加朋友</button>
    </div>
    <div class="modal-actions" style="margin-top: 12px;">
      <button class="btn btn-primary btn-full" id="ai-close">关闭</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：添加 AI 朋友 ============ -->
<div class="modal-mask" id="modal-ai-add">
  <div class="modal" data-stop>
    <div class="modal-handle"></div>
    <div class="modal-title">添加AI朋友</div>

    <div class="form-group">
      <label class="form-label">昵称（必填）</label>
      <input type="text" class="form-input" id="new-friend-name" maxlength="10" placeholder="给TA起个名字" />
      <div class="form-hint" id="new-friend-name-counter">0 / 10</div>
    </div>

    <div class="form-group">
      <label class="form-label">头像</label>
      <div class="ai-avatar-row">
        <div class="ai-avatar-preview" id="new-friend-avatar-preview">😊</div>
        <div style="flex:1;">
          <div style="font-size:11px;color:var(--text-tertiary);margin-bottom:4px;">当前头像</div>
          <div style="font-size:12px;color:var(--text-secondary);">点击下方 Emoji 或上传图片</div>
        </div>
      </div>
      <div class="ai-emoji-grid" id="new-friend-emojis"></div>
      <button class="ai-upload-btn" id="new-friend-upload-btn">📷 上传自定义头像</button>
      <input type="file" id="new-friend-file-input" accept="image/*" style="display:none" />
    </div>

    <div class="form-group">
      <label class="form-label">性格特征（选填，可多选）</label>
      <div class="trait-pairs" id="new-friend-trait-pairs">
        <div class="trait-pair-row">
          <button type="button" class="trait-pill" data-trait-row="0" data-trait="温柔">温柔</button>
          <button type="button" class="trait-pill" data-trait-row="0" data-trait="高冷">高冷</button>
        </div>
        <div class="trait-pair-row">
          <button type="button" class="trait-pill" data-trait-row="1" data-trait="安静">安静</button>
          <button type="button" class="trait-pill" data-trait-row="1" data-trait="话痨">话痨</button>
        </div>
        <div class="trait-pair-row">
          <button type="button" class="trait-pill" data-trait-row="2" data-trait="热情">热情</button>
          <button type="button" class="trait-pill" data-trait-row="2" data-trait="冷淡">冷淡</button>
        </div>
        <div class="trait-pair-row">
          <button type="button" class="trait-pill" data-trait-row="3" data-trait="毒舌">毒舌</button>
          <button type="button" class="trait-pill" data-trait-row="3" data-trait="暖言">暖言</button>
        </div>
        <div class="trait-pair-row">
          <button type="button" class="trait-pill" data-trait-row="4" data-trait="文艺">文艺</button>
          <button type="button" class="trait-pill" data-trait-row="4" data-trait="直白">直白</button>
        </div>
        <div class="trait-pair-row">
        <button type="button" class="trait-pill" data-trait-row="5" data-trait="Bking">Bking</button>
        <button type="button" class="trait-pill" data-trait-row="5" data-trait="土纯">土纯</button>
       </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">身份背景</label>
      <div class="identity-pills" id="new-friend-identity-pills">
        <button type="button" class="identity-pill" data-identity="邻居">邻居</button>
        <button type="button" class="identity-pill" data-identity="最好友">最好友</button>
        <button type="button" class="identity-pill" data-identity="学哥">学哥</button>
        <button type="button" class="identity-pill" data-identity="学姐">学姐</button>
        <button type="button" class="identity-pill" data-identity="同事">同事</button>
        <button type="button" class="identity-pill" data-identity="发小">发小</button>
        <button type="button" class="identity-pill" data-identity="网友">网友</button>
        <button type="button" class="identity-pill" data-identity="普通朋友">普通朋友</button>
    </div>
</div>
                   
    <div class="modal-actions">
      <button class="btn" id="new-friend-cancel">取消</button>
      <button class="btn btn-primary" id="new-friend-save">保存</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：确认删除 ============ -->
<div class="modal-mask center" id="modal-confirm">
  <div class="confirm-modal" data-stop>
    <div class="confirm-title">删除这件作品？</div>
    <div class="confirm-text">删除后将无法恢复，AI 挚友的评论也会一同消失。</div>
    <div class="confirm-actions">
      <button class="btn" id="confirm-cancel">取消</button>
      <button class="btn btn-danger" id="confirm-ok">删除</button>
    </div>
  </div>
</div>


<!-- ============ 弹窗：导入/导出文本 ============ -->
<div class="modal-mask" id="modal-data-io">
  <div class="modal" data-stop>
    <div class="modal-handle"></div>
    <div class="modal-title" id="data-io-title">导出数据</div>
    <div class="form-group">
      <div class="form-hint" id="data-io-hint" style="text-align:left;">请长按选中文本后手动复制</div>
      <textarea class="form-textarea selectable-text" id="data-io-text" style="min-height:160px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" id="data-io-cancel">关闭</button>
      <button class="btn btn-primary" id="data-io-confirm">确定导入</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：分享 ============ -->
<div class="modal-mask" id="modal-share">
  <div class="modal" data-stop>
    <div class="modal-handle"></div>
    <div class="modal-title">分享主页</div>
    <div class="form-group">
      <label class="form-label">主页链接</label>
      <div class="form-input selectable-text" id="share-link"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="share-close">关闭</button>
      <button class="btn btn-primary btn-full" id="share-copy">长按上方链接复制</button>
    </div>
  </div>
</div>

<!-- ============ 弹窗：草稿箱 ============ -->
<div class="modal-mask" id="modal-drafts">
  <div class="modal" data-stop>
    <div class="modal-handle"></div>
    <div class="modal-title">草稿箱</div>
    <div class="drafts-list" id="drafts-list"></div>
    <div class="modal-actions" style="margin-top: 8px;">
      <button class="btn btn-primary btn-full" id="drafts-close">关闭</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
